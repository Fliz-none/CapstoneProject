version: "3.1"

intents:
  - greet
  - goodbye
  - affirm_cancel
  - deny_cancel
  - mood_great
  - mood_unhappy
  - bot_challenge
  - check_order
  - cancel_order
  - check_stock
  - check_product
  - ask_company
  - ask_branch
  - ask_post
  - ask_promotions
  - ask_payment_methods
  - ask_return_policy
  - ask_opening_hours
  - nlu_fallback
  - out_of_scope
  - ask_how_to_shop
  - ask_price
  - ask_about_ai_emotions
  - thank

responses:
  utter_greet:
    - text: "Chào, bạn cần giúp đỡ gì không?"
    - text: "Chào bạn, hôm nay bạn cảm thấy thế nào?"
    - text: "Tôi là một trợ lý ảo, được phát triển bởi nhóm SMS. \n Bạn cần tôi giúp gì không?"

  utter_cheer_up:
    - text: "Đừng buồn nữa nhé, hãy ra ngoài và hít thở không khí mới nào!"
    - text: "Vui lên nhé, hãy ra ngoài và hít thở không khí nào!"

  utter_did_that_help:
    - text: "Thông tin đó có giúp ích cho bạn không?"
    - text: "Bạn cần cung cấp thêm thông tin không?"

  utter_happy:
    - text: "Có gì vui thế"
    - text: "Thật thú vị!"
    - text: "Bạn có gì vui hãy chia sẽ với tớ đi!"

  utter_goodbye:
    - text: "Tạm biệt bạn nhé!"
    - text: "Bye bạn nhé!"
    - text: "Hẹn gặp lại sớm nhé!"

  utter_iamabot:
    - text: "Tôi là một trợ lý ảo, được phát triển bởi SMS."
    - text: "Mình là chatbot được SMS tạo ra để hỗ trợ bạn."
    - text: "Bạn đang trò chuyện với trợ lý ảo SMSBot nè!"
    - text: "Tôi là SMSBot trợ lý ảo đáng tin của bạn."

  utter_cancel_denied:
    - text: "Oke bạn nhé."
    - text: "Oke nhé."
    - text: "Đã hủy thao tác hủy đơn hàng."

  utter_opening_hours:
    - text: "Cửa hàng mở cửa từ 8:00 sáng đến 9:00 tối mỗi ngày, kể cả cuối tuần."
    - text: "Shop mở của cả tuần từ 8h sáng đến 9h tối mỗi ngày ạ."

  utter_return_policy:
    - text: "Shop hỗ trợ đổi trả trong vòng 7 ngày với sản phẩm còn nguyên tem mác và chưa qua sử dụng."

  utter_payment_methods:
    - text: "Shop hỗ trợ thanh toán bằng tiền mặt, chuyển khoản, ví điện tử (VNPay), và thẻ ngân hàng."

  utter_default:
    - text: "Tôi chưa hiểu ý bạn lắm!"
    - text: "Bạn có thể hỏi rõ hơn không?"
    - text: "Xin lỗi, tôi không hiểu bạn đang nói gì."
    - text: Xin lỗi, tôi không hiểu bạn đang nói gì. Bạn có thể hỏi lại không?

  utter_how_to_shop:
    - text: "Bạn vui lòng truy cập https://smsolutions.io.vn/ nhé. Hoặc có thể đến trực tiếp tại cửa hàng theo thông tin trên website nhé!"
    - text: "Bạn có thể mua hàng trực tiếp tại website https://smsolutions.io.vn hoặc ghé cửa hàng theo địa chỉ trên web nhé!"
    - text: "Truy cập website https://smsolutions.io.vn để đặt hàng online, hoặc đến cửa hàng theo thông tin liên hệ nhé!"
  
  utter_ask_about_ai_emotions:
    - text: "Mình không có cảm xúc thật 😎 nhưng vẫn ổn!"
    - text: "Cảm ơn bạn đã hỏi, SMSbot đang hoạt động bình thường 😁"
    - text: "SMSbot không buồn, không vui, nhưng luôn sẵn sàng chat với bạn!"
    - text: "SMSbot luôn ổn định và sẵn sàng trò chuyện với bạn nha!"
  
  utter_thank:
    - text: "Không có gì, bạn cần gì SMSbot luôn sẵn sàng giúp."
    - text: "SMSbot rất vui khi được hỗ trợ bạn 😄"
    - text: "Rất vui khi được hỗ trợ bạn <3"

entities:
  - order_id
  - product_name

slots:
  
  last_product_id:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  last_product_name:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  order_id:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: order_id

  product_name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: product_name

actions:
  - action_check_order
  - action_ask_to_confirm_cancel
  - action_cancel_order
  - action_check_stock
  - action_check_product
  - action_ask_company
  - action_ask_branch
  - action_ask_post
  - action_ask_promotions
  - action_default_fallback
  - action_check_price
  
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
